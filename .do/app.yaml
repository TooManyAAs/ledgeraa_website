# DigitalOcean App Platform spec: Ledgeraa marketing website (static site).
# Mirrors the live app `ledgeraa-website`. DO doesn't read this file; apply
# changes to the live app (dashboard → Settings → App Spec, or doctl) and keep
# this copy in sync. Every push to `prod` deploys.
name: ledgeraa-website
region: lon
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: ledgeraa.com
    type: PRIMARY
    zone: ledgeraa.com
  - domain: www.ledgeraa.com
    type: ALIAS
    zone: ledgeraa.com
ingress:
  rules:
    # Must stay first: www → apex, keeping the path.
    - match:
        authority:
          exact: www.ledgeraa.com
        path:
          prefix: /
      redirect:
        authority: ledgeraa.com
        redirect_code: 301
    - match:
        authority:
          exact: ""
        path:
          prefix: /
      component:
        name: ledgeraa-website
static_sites:
  - name: ledgeraa-website
    source_dir: /
    environment_slug: node-js
    github:
      repo: TooManyAAs/ledgeraa_website
      branch: prod
      deploy_on_push: true
    build_command: npm run build
    output_dir: dist
    # Every route has its own dist/<route>/index.html (scripts/build-pages.mjs).
    # Anything else falls back to the SPA, which renders the noindexed 404 page.
    catchall_document: index.html
    envs:
      - key: APP_ORIGIN
        value: https://app.ledgeraa.com
        scope: BUILD_TIME
