# Runs on every PR and on pushes to main. Lint, audit and tests are separate
# jobs so each reports its own status check.

name: Lint, test and audit

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    env:
      APP_ORIGIN: https://app.ledgeraa.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Includes the type check (tsc -b) and the per-route HTML step.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
